<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solarii - JuegAhorro</title>

    <link rel="icon" href="icono.jpg" type="image/jpeg">

    <!-- Bootstrap 5 CSS CDN (solo para responsividad en móviles) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS DEL JUEGO -->
    <link rel="stylesheet" href="juegahorro.css">

</head>


<body>

    <!-- =========================
         MENU
         ========================= -->

    <header>

        <div class="logo">
            ☀ Solarii
        </div>

        <nav>

            <a href="index.html">
                Inicio
            </a>

            <a href="juegahorro.html">
                JuegAhorro
            </a>

            <a href="productos.html">
                Productos
            </a>

            <a href="nosotros.html">
                Nosotros
            </a>

            <a href="contacto.html">
                Contacto
            </a>

        </nav>

    </header>


    <!-- =========================
         TITULO
         ========================= -->

    <section class="titulo">

        <p class="subtitulo">
            JUEGA Y AHORRA CON SOLARII
        </p>

        <h1>
            JuegAhorro
        </h1>

        <p>
            Come las frutas, consigue puntos y gana descuentos.
        </p>

        <p class="regla">
            Cada punto = 2% de descuento.
            Máximo 20%.
        </p>

    </section>


    <!-- =========================
         JUEGO
         ========================= -->

    <div id="game-container">

        <canvas
            id="gc"
            class="game-canvas"
            width="400"
            height="400">
        </canvas>

    </div>


    <!-- =========================
         INFORMACION
         ========================= -->

    <div class="informacion">

        <h2>
            Tu recompensa
        </h2>

        <p id="puntos">
            Puntos: 0
        </p>

        <p id="descuento">
            Descuento: 0%
        </p>

        <p id="mensaje">
            Usa las flechas para comenzar.
        </p>

    </div>


    <!-- =========================
         BOTONES
         ========================= -->

    <div class="keys">

        <!-- ARRIBA -->

        <a
            class="arr"
            onclick="botonArriba()">

            ▲

        </a>

        <br>


        <!-- IZQUIERDA -->

        <a
            class="arr"
            onclick="botonIzquierda()">

            ◀

        </a>


        <!-- ABAJO -->

        <a
            class="arr"
            onclick="botonAbajo()">

            ▼

        </a>


        <!-- DERECHA -->

        <a
            class="arr"
            onclick="botonDerecha()">

            ▶

        </a>

    </div>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script src="game.js"></script>

    <target="_blank"></target>

</body>

</html>
